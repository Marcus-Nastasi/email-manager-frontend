<main class="p-32">
  <spartan-button-preview />

  <div hlmAlert class="w-1/2">
    <ng-icon hlm hlmAlertIcon name="lucideBox" />
    <h4 hlmAlertTitle>Introducing spartan/ui!</h4>
    <p hlmAlertDesc>
      spartan/ui is made up of unstyled UI providers, the spartan/ui/brain.<br />
      On top we add spartan/ui/helm(et) with shadcn-like styles.
    </p>
  </div>

  <section hlmCard>
    <div hlmCardHeader>
      <h3 hlmCardTitle>Card Title</h3>
      <p hlmCardDescription>Card Description</p>
    </div>
    <p hlmCardContent>Card Content</p>
    <p hlmCardFooter>Card Footer</p>
  </section>

  <button hlmBtn variant="outline" [brnMenuTriggerFor]="menu">
    Open
  </button>

  <ng-template #menu>
    <hlm-menu>
      <hlm-menu-label>My Account</hlm-menu-label>
      <hlm-menu-separator />
      <hlm-menu-group>
        <button hlmMenuItem>
          Profile
          <hlm-menu-shortcut>⇧⌘P</hlm-menu-shortcut>
        </button>

        <hlm-menu-separator />
        
        <button hlmMenuItem>
          Invite Users
        <hlm-menu-item-sub-indicator />
        </button>
      </hlm-menu-group>
    </hlm-menu>
  </ng-template>

</main>

<router-outlet />
